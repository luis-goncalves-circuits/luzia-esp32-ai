name: Testes e compilação

on:
  push:
    branches: [main, "improvement/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Executar testes unitários
        run: python -m unittest discover -s tests -v
      - name: Verificar sintaxe Python
        run: python -m compileall -q luzia_server.py luzia_core.py run.py

  firmware:
    name: Compilar firmware ESP32
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Adicionar índice Espressif
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
      - name: Instalar Arduino-ESP32 3.0.7
        run: arduino-cli core install esp32:esp32@3.0.7
      - name: Criar configuração Wi-Fi temporária
        run: |
          printf '#pragma once\n#define WIFI_SSID "ci-network"\n#define WIFI_PASSWORD "ci-password"\n' > firmware/luzia_esp32/secrets.h
      - name: Compilar para ESP32 Dev Module
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/luzia_esp32
